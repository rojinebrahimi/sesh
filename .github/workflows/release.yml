name: release

# Every push to main that changes code is tested, tagged (next patch version) and released
# with static binaries for linux/macOS/windows on amd64 and arm64.
# Run it by hand to choose a bigger bump (minor/major).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Next version
        id: v
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<<"${last#v}"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          echo "previous=$last" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Releasing $major.$minor.$patch (was $last)"

      - name: Build archives
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            name=sesh_${VERSION}_${os}_${arch}
            ext=; [ "$os" = windows ] && ext=.exe
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/rojinebrahimi/sesh/cmd.Version=$VERSION" \
              -o "dist/$name/sesh$ext" .
            cp README.md LICENSE "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name")
            else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
          PREV: ${{ steps.v.outputs.previous }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "sesh $TAG" \
            --generate-notes \
            --notes-start-tag "$PREV" 2>/dev/null \
          || gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "sesh $TAG" --generate-notes

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/rojinebrahimi/sesh:${{ steps.v.outputs.version }}
            ghcr.io/rojinebrahimi/sesh:latest

  # Lists the server in the official MCP Registry. Needs the ghcr.io/rojinebrahimi/sesh package to be public.
  registry:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version into server.json
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version=$v | .packages[0].identifier="ghcr.io/rojinebrahimi/sesh:"+$v' server.json > s.json
          mv s.json server.json
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
