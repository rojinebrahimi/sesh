<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="sesh logo">
  <title>sesh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26335a"/><stop offset="1" stop-color="#0a0f1d"/></linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="150" cy="150" r="110" fill="url(#glow)"/>
  <!-- abandoned branches: kept on disk, dimmed -->
  <path d="M88 128 C124 128 118 62 160 62" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 16"/>
  <circle cx="160" cy="62" r="13" fill="none" stroke="#64748b" stroke-width="7"/>
  <path d="M128 128 C150 128 146 96 176 96" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 14"/>
  <circle cx="176" cy="96" r="9" fill="none" stroke="#475569" stroke-width="6"/>
  <!-- active branch, with glow -->
  <g filter="url(#soft)" opacity=".7"><path d="M44 128 H88 C124 128 124 190 164 190 H206" fill="none" stroke="url(#live)" stroke-width="16" stroke-linecap="round"/></g>
  <path d="M44 128 H88 C124 128 124 190 164 190 H206" fill="none" stroke="url(#live)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="44" cy="128" r="15" fill="#34d399"/>
  <circle cx="88" cy="128" r="15" fill="#2dd4bf"/>
  <circle cx="164" cy="190" r="15" fill="#38bdf8"/>
  <circle cx="206" cy="190" r="21" fill="#818cf8"/>
  <circle cx="206" cy="190" r="8" fill="#0a0f1d"/>
</svg>
